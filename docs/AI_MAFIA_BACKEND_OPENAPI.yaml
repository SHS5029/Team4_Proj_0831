openapi: 3.1.0
info:
  title: AI Mafia Backend API
  version: 2026-09-02.v1
  description: Frontend와 Backend 사이의 독립 구현용 확정 계약
servers:
  - url: http://localhost:8000
    description: 로컬 개발
tags:
  - name: health
  - name: games
  - name: admin
paths:
  /health:
    get:
      tags: [health]
      responses:
        '200':
          description: 프로세스 생존
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
              example: { status: ok }
  /api/v1/games:
    post:
      tags: [games]
      operationId: createGame
      parameters: [{ $ref: '#/components/parameters/XUserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGameRequest' }
            example: { player_count: 6, ruleset_version: basic-v1, idempotency_key: 00000000-0000-4000-8000-000000000001 }
      responses:
        '201':
          description: 생성됨
          content: { application/json: { schema: { $ref: '#/components/schemas/CreateGameResponse' } } }
        '400': { $ref: '#/components/responses/InvalidUserId' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [games]
      operationId: listGames
      parameters:
        - { $ref: '#/components/parameters/XUserId' }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/GameStatus' } }
        - { name: cursor, in: query, required: false, schema: { type: string, nullable: true } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: 게임 목록
          content: { application/json: { schema: { $ref: '#/components/schemas/GameListResponse' } } }
  /api/v1/games/{game_id}:
    parameters:
      - { $ref: '#/components/parameters/XUserId' }
      - { $ref: '#/components/parameters/GameId' }
    get:
      tags: [games]
      operationId: getGameState
      responses:
        '200': { description: 현재 상태, content: { application/json: { schema: { $ref: '#/components/schemas/GameStateResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/games/{game_id}/commands:
    post:
      tags: [games]
      operationId: submitGameCommand
      parameters: [{ $ref: '#/components/parameters/XUserId' }, { $ref: '#/components/parameters/GameId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GameCommandRequest' } } }
      responses:
        '202': { description: 수락됨, content: { application/json: { schema: { $ref: '#/components/schemas/CommandAcceptedResponse' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/games/{game_id}/operations/{operation_id}:
    get:
      tags: [games]
      operationId: getOperation
      parameters: [{ $ref: '#/components/parameters/XUserId' }, { $ref: '#/components/parameters/GameId' }, { $ref: '#/components/parameters/OperationId' }]
      responses:
        '200': { description: operation 상태, content: { application/json: { schema: { $ref: '#/components/schemas/OperationResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/games/{game_id}/events:
    get:
      tags: [games]
      operationId: streamGameEvents
      parameters:
        - { $ref: '#/components/parameters/XUserId' }
        - { $ref: '#/components/parameters/GameId' }
        - { name: Last-Event-ID, in: header, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: 게임 이벤트 SSE
          content:
            text/event-stream:
              schema: { type: string }
              example: "id: 19\nevent: game.state_changed\ndata: {\"game_id\":\"uuid\",\"state_version\":19,\"phase\":\"DAY_VOTE\"}\n\n"
  /api/v1/games/{game_id}/result:
    get:
      tags: [games]
      parameters: [{ $ref: '#/components/parameters/XUserId' }, { $ref: '#/components/parameters/GameId' }]
      responses:
        '200': { description: 종료 결과, content: { application/json: { schema: { $ref: '#/components/schemas/GameResultResponse' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/games/{game_id}/notes:
    parameters: [{ $ref: '#/components/parameters/XUserId' }, { $ref: '#/components/parameters/GameId' }]
    get:
      tags: [games]
      responses: { '200': { description: 개인 메모, content: { application/json: { schema: { $ref: '#/components/schemas/NotesResponse' } } } } }
    put:
      tags: [games]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotesRequest' } } } }
      responses:
        '200': { description: 저장됨, content: { application/json: { schema: { $ref: '#/components/schemas/NotesResponse' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/games/{game_id}/feedback:
    post:
      tags: [games]
      parameters: [{ $ref: '#/components/parameters/XUserId' }, { $ref: '#/components/parameters/GameId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackRequest' }, example: { rating: 4, idempotency_key: 00000000-0000-4000-8000-000000000002 } } } }
      responses:
        '201': { description: 등록됨, content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackResponse' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/kpis:
    get:
      tags: [admin]
      parameters: [{ $ref: '#/components/parameters/XUserId' }, { $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }]
      responses: { '200': { description: KPI, content: { application/json: { schema: { $ref: '#/components/schemas/KpiResponse' } } } } }
  /api/v1/admin/logs:
    get:
      tags: [admin]
      parameters: [{ $ref: '#/components/parameters/XUserId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: 운영 로그, content: { application/json: { schema: { $ref: '#/components/schemas/PagedResponse' } } } } }
  /api/v1/admin/feedback:
    get:
      tags: [admin]
      parameters: [{ $ref: '#/components/parameters/XUserId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: feedback 목록, content: { application/json: { schema: { $ref: '#/components/schemas/PagedResponse' } } } } }
components:
  parameters:
    XUserId: { name: X-User-Id, in: header, required: true, schema: { type: string, format: uuid } }
    GameId: { name: game_id, in: path, required: true, schema: { type: string, format: uuid } }
    OperationId: { name: operation_id, in: path, required: true, schema: { type: string, format: uuid } }
    From: { name: from, in: query, required: true, schema: { type: string, format: date } }
    To: { name: to, in: query, required: true, schema: { type: string, format: date } }
    Cursor: { name: cursor, in: query, required: false, schema: { type: string, nullable: true } }
    Limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
  responses:
    InvalidUserId: { description: X-User-Id 오류, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { code: INVALID_USER_ID, message: 사용자 식별자가 올바르지 않습니다., details: null, trace_id: uuid } } } }
    ValidationError: { description: schema 오류, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: 리소스 없음, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: 상태·중복 충돌, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    Uuid: { type: string, format: uuid }
    Time: { type: string, format: date-time }
    HealthResponse: { type: object, additionalProperties: false, required: [status], properties: { status: { type: string, enum: [ok] } } }
    GameStatus: { type: string, enum: [IN_PROGRESS, PAUSED, FINISHED] }
    Phase: { type: string, enum: [ROLE_REVEAL, NIGHT_ACTION, DAY_ANNOUNCEMENT, DAY_DISCUSSION, DAY_VOTE, DAY_REVOTE, PAUSED, FINISHED] }
    CreateGameRequest:
      type: object
      additionalProperties: false
      required: [player_count, ruleset_version, idempotency_key]
      properties:
        player_count: { type: integer, minimum: 5, maximum: 9 }
        ruleset_version: { type: string, enum: [basic-v1] }
        idempotency_key: { $ref: '#/components/schemas/Uuid' }
    PlayerPublic:
      type: object
      additionalProperties: false
      required: [player_id, display_name, kind, alive]
      properties:
        player_id: { $ref: '#/components/schemas/Uuid' }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        kind: { type: string, enum: [HUMAN, AI] }
        alive: { type: boolean }
    PlayerSelf:
      allOf:
        - $ref: '#/components/schemas/PlayerPublic'
        - type: object
          required: [role]
          properties: { role: { type: string, enum: [MAFIA, DETECTIVE, DOCTOR, CITIZEN] } }
    GameSummary:
      type: object
      additionalProperties: false
      required: [game_id, status, phase, round, living_player_count, player_count, state_version, created_at, updated_at]
      properties:
        game_id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/GameStatus' }
        phase: { $ref: '#/components/schemas/Phase' }
        round: { type: integer, minimum: 0 }
        living_player_count: { type: integer, minimum: 0 }
        player_count: { type: integer, minimum: 5, maximum: 9 }
        state_version: { type: integer, minimum: 1 }
        created_at: { $ref: '#/components/schemas/Time' }
        updated_at: { $ref: '#/components/schemas/Time' }
    CreateGameResponse:
      type: object
      additionalProperties: false
      required: [game_id, status, phase, state_version, player, players]
      properties:
        game_id: { $ref: '#/components/schemas/Uuid' }
        status: { const: IN_PROGRESS }
        phase: { const: ROLE_REVEAL }
        state_version: { type: integer, const: 1 }
        player: { $ref: '#/components/schemas/PlayerSelf' }
        players: { type: array, minItems: 5, maxItems: 9, items: { $ref: '#/components/schemas/PlayerPublic' } }
    GameListResponse:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/GameSummary' } }, next_cursor: { type: string, nullable: true } }
    GameCommandRequest:
      type: object
      additionalProperties: false
      required: [command, expected_version, idempotency_key]
      properties:
        command: { type: string, enum: [BEGIN_GAME, SPEAK, CAST_VOTE, KILL, INVESTIGATE, PROTECT, PAUSE, RESUME, FAST_FORWARD] }
        target_player_id: { $ref: '#/components/schemas/Uuid', nullable: true }
        message: { type: string, minLength: 1, maxLength: 280, nullable: true }
        mode: { type: string, enum: [NEXT_PHASE, UNTIL_FINISHED], nullable: true }
        expected_version: { type: integer, minimum: 1 }
        idempotency_key: { $ref: '#/components/schemas/Uuid' }
    CommandAcceptedResponse:
      type: object
      additionalProperties: false
      required: [accepted, operation_id, state_version, phase, status]
      properties:
        accepted: { type: boolean, const: true }
        operation_id: { $ref: '#/components/schemas/Uuid' }
        state_version: { type: integer, minimum: 1 }
        phase: { $ref: '#/components/schemas/Phase' }
        status: { type: string, enum: [QUEUED, COMPLETED] }
    GameStateResponse:
      type: object
      additionalProperties: false
      required: [game_id, status, phase, round, state_version, players, public_events, private_events, allowed_commands, valid_targets, revote_target_player_ids, active_operation, updated_at]
      properties:
        game_id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/GameStatus' }
        phase: { $ref: '#/components/schemas/Phase' }
        round: { type: integer, minimum: 0 }
        state_version: { type: integer, minimum: 1 }
        phase_started_at: { $ref: '#/components/schemas/Time', nullable: true }
        phase_deadline_at: { $ref: '#/components/schemas/Time', nullable: true }
        current_turn_player_id: { $ref: '#/components/schemas/Uuid', nullable: true }
        your_player: { $ref: '#/components/schemas/PlayerSelf', nullable: true }
        players: { type: array, items: { $ref: '#/components/schemas/PlayerPublic' } }
        public_events: { type: array, items: { type: object, additionalProperties: true } }
        private_events: { type: array, items: { type: object, additionalProperties: true } }
        allowed_commands: { type: array, items: { type: string } }
        valid_targets: { type: array, items: { type: object, additionalProperties: false, required: [command, player_ids], properties: { command: { type: string }, player_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } } } } }
        revote_target_player_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        active_operation: { type: object, nullable: true, additionalProperties: false }
        updated_at: { $ref: '#/components/schemas/Time' }
    OperationResponse:
      type: object
      additionalProperties: false
      required: [operation_id, game_id, command, status, accepted_version, result_version, error_code, created_at, updated_at]
      properties:
        operation_id: { $ref: '#/components/schemas/Uuid' }
        game_id: { $ref: '#/components/schemas/Uuid' }
        command: { type: string }
        status: { type: string, enum: [QUEUED, RUNNING, COMPLETED, FAILED, PAUSED] }
        accepted_version: { type: integer }
        result_version: { type: integer, nullable: true }
        error_code: { type: string, nullable: true }
        created_at: { $ref: '#/components/schemas/Time' }
        updated_at: { $ref: '#/components/schemas/Time' }
    NotesRequest:
      type: object
      additionalProperties: false
      required: [content, expected_notes_version, idempotency_key]
      properties: { content: { type: string, maxLength: 2000 }, expected_notes_version: { type: integer, minimum: 0 }, idempotency_key: { $ref: '#/components/schemas/Uuid' } }
    NotesResponse:
      type: object
      additionalProperties: false
      required: [game_id, user_id, content, notes_version, updated_at]
      properties: { game_id: { $ref: '#/components/schemas/Uuid' }, user_id: { $ref: '#/components/schemas/Uuid' }, content: { type: string, maxLength: 2000 }, notes_version: { type: integer, minimum: 0 }, updated_at: { $ref: '#/components/schemas/Time', nullable: true } }
    FeedbackRequest:
      type: object
      additionalProperties: false
      required: [rating, idempotency_key]
      properties: { rating: { type: integer, minimum: 1, maximum: 5 }, idempotency_key: { $ref: '#/components/schemas/Uuid' } }
    FeedbackResponse:
      type: object
      additionalProperties: false
      required: [feedback_id, game_id, rating, created_at]
      properties: { feedback_id: { $ref: '#/components/schemas/Uuid' }, game_id: { $ref: '#/components/schemas/Uuid' }, rating: { type: integer, minimum: 1, maximum: 5 }, created_at: { $ref: '#/components/schemas/Time' } }
    GameResultResponse: { type: object, required: [game_id, winner, finish_reason, rounds, duration_seconds, human_survived, human_vote_accuracy, my_rating, players, timeline], properties: { game_id: { $ref: '#/components/schemas/Uuid' }, winner: { type: string, enum: [CITIZEN, MAFIA] }, finish_reason: { type: string }, rounds: { type: integer }, duration_seconds: { type: integer }, human_survived: { type: boolean }, human_vote_accuracy: { type: number, nullable: true }, my_rating: { type: integer, nullable: true }, players: { type: array, items: { type: object } }, timeline: { type: array, items: { type: object } } } }
    KpiResponse: { type: object, required: [period, sample_size], properties: { period: { type: object }, sample_size: { type: integer, minimum: 0 }, new_games: { type: integer }, completion_rate: { type: number, nullable: true }, average_duration_seconds: { type: number, nullable: true }, average_rounds: { type: number, nullable: true }, resume_rate: { type: number, nullable: true }, llm_success_rate: { type: number, nullable: true }, llm_timeout_rate: { type: number, nullable: true }, llm_fallback_rate: { type: number, nullable: true }, average_llm_latency_ms: { type: number, nullable: true }, total_tokens: { type: integer }, estimated_cost_usd: { type: number, nullable: true }, average_feedback_rating: { type: number, nullable: true }, breakdowns: { type: array, items: { type: object } } } }
    PagedResponse: { type: object, required: [items, next_cursor], properties: { items: { type: array, items: { type: object } }, next_cursor: { type: string, nullable: true } } }
    ErrorResponse: { type: object, additionalProperties: false, required: [code, message, details, trace_id], properties: { code: { type: string }, message: { type: string }, details: {}, trace_id: { $ref: '#/components/schemas/Uuid' } } }
